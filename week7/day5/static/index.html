```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CIA CSV Analyst</title>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            margin: 0;
            padding: 30px;
        }

        .container {
            max-width: 900px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 3px 15px rgba(0,0,0,0.1);
        }

        h1 {
            margin-top: 0;
        }

        .section {
            margin-top: 25px;
        }

        input[type="file"],
        input[type="text"] {
            padding: 10px;
            width: 100%;
            box-sizing: border-box;
            margin-top: 8px;
        }

        button {
            margin-top: 12px;
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            background: #2563eb;
            color: white;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        #status {
            margin-top: 10px;
            font-weight: bold;
        }

        #answer {
            margin-top: 15px;
            padding: 15px;
            background: #f1f5f9;
            border-radius: 8px;
            min-height: 30px;
        }

        .chart-container {
            margin-top: 30px;
        }

        canvas {
            max-height: 400px;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>📊 CIA CSV Analyst</h1>

    <p>
        Upload a CSV file and ask questions about your data using PandasAI.
    </p>

    <!-- CSV Upload -->
    <div class="section">

        <h2>1. Upload CSV</h2>

        <input
            type="file"
            id="csvFile"
            accept=".csv"
        >

        <button onclick="uploadCSV()">
            Upload CSV
        </button>

        <div id="status"></div>

    </div>


    <!-- Question -->
    <div class="section">

        <h2>2. Ask a Question</h2>

        <input
            type="text"
            id="question"
            placeholder="Example: What is the total sales?"
        >

        <button onclick="askCIA()">
            Ask CIA
        </button>

    </div>


    <!-- Answer -->
    <div class="section">

        <h2>3. Answer</h2>

        <div id="answer">
            Upload a CSV and ask a question.
        </div>

    </div>


    <!-- Chart -->
    <div class="chart-container">

        <h2>4. Chart</h2>

        <canvas id="myChart"></canvas>

    </div>

</div>


<script src="/static/script.js"></script>

</body>
</html>
```
